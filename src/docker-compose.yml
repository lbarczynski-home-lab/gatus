services:
  gatus:
    image: ghcr.io/twin/gatus:v5.37.0
    container_name: gatus
    hostname: gatus.ctr.xbhl.intranet
    env_file:
      - env/gatus.env
      - env/db.env
      - env/service-tokens.env
      - env/discord.env
      - env/smtp.env
    volumes:
      - ./config:/config
      - ./bin:/bin:ro
    networks:
      - proxy
      - socket-proxy
      - internal
    ports:
      - "12441:8080"
    healthcheck:
      test: [ "CMD", "/bin/busybox", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus-router.rule=Host(`status.intranet.xbhl.online`)"
      - "traefik.http.routers.gatus-router.entrypoints=websecure"
      - "traefik.http.routers.gatus-router.tls=true"
      - "traefik.http.routers.gatus-router.service=gatus"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
      - 'wud.watch=true'
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
      - "wud.link.template=https://github.com/TwiN/gatus/releases/tag/v$${major}.$${minor}.$${patch}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18.4
    volumes:
      - db:/var/lib/postgresql
    env_file:
      - env/db.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

volumes:
  db:
    driver: local

networks:
  internal:
    internal: true

  proxy:
    external: true

  socket-proxy:
    external: true
