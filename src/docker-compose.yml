services:
  gatus:
    build:
      context: .
      dockerfile: Dockerfile.gatus
      args:
        GATUS_VERSION: ${GATUS_VERSION}
    image: gatus-extended:${GATUS_VERSION}
    pull_policy: build
    container_name: gatus
    environment:
      - GATUS_DOMAIN=${GATUS_DOMAIN:?err}
      - GATUS_CONFIG_PATH=/config
      - GATUS_LOG_LEVEL=INFO
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
    volumes:
      - ./config:/config
    hostname: gatus.ctr.xbhl.intranet
    networks:
      - internal
      - proxy
    ports:
      - "${GATUS_PORT:?err}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus-router.rule=Host(`${GATUS_DOMAIN:?err}`)"
      - "traefik.http.routers.gatus-router.entrypoints=websecure"
      - "traefik.http.routers.gatus-router.tls=true"
      - "traefik.http.routers.gatus-router.service=gatus"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18.4
    volumes:
      - db:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

volumes:
  db:
    driver: local

networks:
  internal:

  proxy:
    external: true
