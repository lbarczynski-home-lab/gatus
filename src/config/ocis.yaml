alerts: &alerts
  - type: discord
  - type: email

endpoints:
  - name: ocis-health-status
    group: ocis
    url: "https://files.xbhl.online/status"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].installed == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: ocis-container-status
    group: ocis
    url: "http://cloud.vm.xbhl.intranet:2375/containers/ocis/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
