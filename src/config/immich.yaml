alerts: &alerts
  - type: discord
  - type: email

endpoints:
  - name: immich-health-status
    group: immich
    url: "https://photos.xbhl.online/api/server/ping"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].res == pong"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: immich-container-status
    group: immich
    url: "http://cloud.vm.xbhl.intranet:2375/containers/immich/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"

  - name: immich-ml-nas-health-status
    group: immich
    url: "https://immich-ml.nas.intranet.xbhl.online/ping"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pong"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: immich-ml-nas-container-status
    group: immich
    url: "http://nas.srv.xbhl.intranet:2375/containers/immich-machine-learning/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
