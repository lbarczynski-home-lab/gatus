alerts: &alerts
  - type: discord
  - type: email

grafana-container-template: &grafana-container-status-template
  group: grafana
  interval: 30s
  conditions:
    - "[STATUS] == 200"
    - "[BODY].State.Running == true"
    - "[BODY].State.Health.Status == healthy"

endpoints:
  - name: grafana-health-status
    group: grafana
    url: "https://grafana.intranet.xbhl.online/api/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == ok"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: victoriametrics-health-status
    group: grafana
    url: "http://infrastructure.vm.xbhl.intranet:8428/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts: *alerts

  - name: loki-readiness-status
    group: grafana
    url: "http://infrastructure.vm.xbhl.intranet:3100/ready"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*ready*)"
    alerts: *alerts

  - name: grafana-container-status
