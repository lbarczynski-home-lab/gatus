alerts: &alerts
  - type: discord
  - type: email

endpoints:
  - name: portainer-health-status
    group: portainer
    url: "https://portainer.intranet.xbhl.online/api/system/status"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].Version) > 0"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: portainer-container-status
    group: portainer
    url: "http://infrastructure.vm.xbhl.intranet:2375/containers/portainer/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
