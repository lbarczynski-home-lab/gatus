alerts: &alerts
  - type: discord
  - type: email

portainer-container-template: &portainer-container-status-template
  group: portainer
  interval: 30s
  conditions:
    - "[STATUS] == 200"
    - "[BODY].State.Running == true"
    - "[BODY].State.Health.Status == healthy"

endpoints:
  - name: portainer-health-status
    group: portainer
    url: "https://portainer.intranet.xbhl.online/api/system/status"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].Version) > 0"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: portainer-server-container-status
    <<: *portainer-container-status-template
    url: "http://infrastructure.vm.xbhl.intranet:2375/containers/portainer/json"

  - name: portainer-agent-infrastructure-container-status
    <<: *portainer-container-status-template
    url: "http://infrastructure.vm.xbhl.intranet:2375/containers/portainer-agent/json"

  - name: portainer-agent-cloud-container-status
    <<: *portainer-container-status-template
    url: "http://cloud.vm.xbhl.intranet:2375/containers/portainer-agent/json"

  - name: portainer-agent-media-container-status
    <<: *portainer-container-status-template
    url: "http://media.vm.xbhl.intranet:2375/containers/portainer-agent/json"

  - name: portainer-agent-code-container-status
    <<: *portainer-container-status-template
    url: "http://code.vm.xbhl.intranet:2375/containers/portainer-agent/json"

  - name: portainer-agent-ha-container-status
    <<: *portainer-container-status-template
    url: "http://ha.vm.xbhl.intranet:2375/containers/portainer-agent/json"

  - name: portainer-agent-dns-container-status
    <<: *portainer-container-status-template
    url: "http://dns.vm.xbhl.intranet:2375/containers/portainer-agent/json"

  - name: portainer-agent-networking-container-status
    <<: *portainer-container-status-template
    url: "http://networking.vm.xbhl.intranet:2375/containers/portainer-agent/json"

  - name: portainer-agent-nas-container-status
    <<: *portainer-container-status-template
    url: "http://nas.srv.xbhl.intranet:2375/containers/portainer-agent/json"
