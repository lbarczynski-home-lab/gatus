alerts: &alerts
  - type: discord
  - type: email

endpoints:
  - name: litellm-health-status
    group: litellm
    url: "https://llm.ai.intranet.xbhl.online/health/readiness"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == healthy"
      - "[BODY].db == connected"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: litellm-container-status
    group: litellm
    url: "http://infrastructure.vm.xbhl.intranet:2375/containers/litellm/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
