alerts: &alerts
  - type: discord
  - type: email

endpoints:
  - name: collabora-office-health-status
    group: collabora-office
    url: "https://office.xbhl.online/hosting/capabilities"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].productVersion) > 0"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: collabora-office-liveness-status
    group: collabora-office
    url: "https://office.xbhl.online/livez"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: collabora-office-readiness-status
    group: collabora-office
    url: "https://office.xbhl.online/readyz"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == ok"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: collabora-office-container-status
    group: collabora-office
    url: "http://cloud.vm.xbhl.intranet:2375/containers/collabora/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
