alerts: &alerts
  - type: discord
  - type: email

endpoints:
  - name: librespeed-health-status
    group: librespeed
    url: "https://speedtest.intranet.xbhl.online/config.json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].useNewDesign == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: librespeed-container-status
    group: librespeed
    url: "http://networking.vm.xbhl.intranet:2375/containers/librespeed/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"

  - name: librespeed-agent-network-health-status
    group: librespeed
    url: "https://librespeed.net.intranet.xbhl.online/empty.php"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: librespeed-agent-network-container-status
    group: librespeed
    url: "http://networking.vm.xbhl.intranet:2375/containers/librespeed-agent/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"

  - name: librespeed-agent-infra-health-status
    group: librespeed
    url: "https://librespeed.infra.intranet.xbhl.online/empty.php"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: librespeed-agent-infra-container-status
    group: librespeed
    url: "http://infrastructure.vm.xbhl.intranet:2375/containers/librespeed-agent/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"

  - name: librespeed-agent-nas-health-status
    group: librespeed
    url: "https://librespeed.nas.intranet.xbhl.online/empty.php"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: librespeed-agent-nas-container-status
    group: librespeed
    url: "http://nas.srv.xbhl.intranet:2375/containers/librespeed-agent/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
