alerts: &alerts
  - type: discord
  - type: email

endpoints:
  - name: llama-cpp-health-status
    group: llama-cpp
    url: "https://llama-cpp.ai.intranet.xbhl.online/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: llama-cpp-container-status
    group: llama-cpp
    url: "http://docker-socket-proxy:2375/containers/llama-cpp/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
