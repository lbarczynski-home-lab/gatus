alerts: &alerts
  - type: discord
  - type: email

traefik-api-template: &traefik-api-overview-template
  group: traefik
  interval: 30s
  conditions:
    - "[STATUS] == 200"
    - "[BODY].http.routers.errors == 0"
    - "[BODY].http.services.errors == 0"
    - "[BODY].http.middlewares.errors == 0"
    - "[BODY].tcp.routers.errors == 0"
    - "[BODY].tcp.services.errors == 0"
    - "[BODY].tcp.middlewares.errors == 0"   
    - "[BODY].udp.routers.errors == 0"
    - "[BODY].udp.services.errors == 0"
    - "[BODY].certificates.errors == 0"
    - "[CERTIFICATE_EXPIRATION] > 48h"
  alerts: *alerts

traefik-container-template: &traefik-container-status-template
  group: traefik
  interval: 30s
  conditions:
    - "[STATUS] == 200"
    - "[BODY].State.Running == true"
    - "[BODY].State.Health.Status == healthy"

endpoints:
  - name: traefik-dns-vm-api-status
    <<: *traefik-api-overview-template
    url: "https://dns.proxy.intranet.xbhl.online/api/overview"

  - name: traefik-dns-vm-container-status
    <<: *traefik-container-status-template
    url: "http://dns.vm.xbhl.intranet:2375/containers/traefik/json"

  - name: traefik-cloud-vm-api-status
    <<: *traefik-api-overview-template
    url: "https://cloud.proxy.intranet.xbhl.online/api/overview"

  - name: traefik-cloud-vm-container-status
    <<: *traefik-container-status-template
    url: "http://cloud.vm.xbhl.intranet:2375/containers/traefik/json"

  - name: traefik-infrastructure-vm-api-status
    <<: *traefik-api-overview-template
    url: "https://infrastructure.proxy.intranet.xbhl.online/api/overview"

  - name: traefik-infrastructure-vm-container-status
    <<: *traefik-container-status-template
    url: "http://infrastructure.vm.xbhl.intranet:2375/containers/traefik/json"

  - name: traefik-media-vm-api-status
    <<: *traefik-api-overview-template
    url: "https://media.proxy.intranet.xbhl.online/api/overview"

  - name: traefik-media-vm-container-status
    <<: *traefik-container-status-template
    url: "http://media.vm.xbhl.intranet:2375/containers/traefik/json"

  - name: traefik-code-vm-api-status
    <<: *traefik-api-overview-template
    url: "https://code.proxy.intranet.xbhl.online/api/overview"

  - name: traefik-code-vm-container-status
    <<: *traefik-container-status-template
    url: "http://code.vm.xbhl.intranet:2375/containers/traefik/json"

  - name: traefik-ha-vm-api-status
    <<: *traefik-api-overview-template
    url: "https://ha.proxy.intranet.xbhl.online/api/overview"

  - name: traefik-proxy-vm-api-status
    <<: *traefik-api-overview-template
    url: "https://traefik.intranet.xbhl.online/api/overview"
    conditions:
    - "[STATUS] == 200"

  - name: traefik-proxy-vm-container-status
    <<: *traefik-container-status-template
    url: "http://proxy.vm.xbhl.intranet:2375/containers/traefik/json"
    conditions:
    - "[STATUS] == 200"

  - name: traefik-nas-srv-api-status
    <<: *traefik-api-overview-template
    url: "https://traefik/api/overview"
    headers:
      Host: "nas.proxy.intranet.xbhl.online"
    client:
      insecure: true

  # - name: traefik-nas-vm-container-status
  #   <<: *traefik-container-status-template
  #   url: "http://nas.srv.xbhl.intranet:2375/containers/traefik/json"
