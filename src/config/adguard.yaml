endpoints:
  - name: resolve-intranet-short-hostname-ip
    group: adguard
    url: "router.xbhl.intranet"
    dns:
      query-name: "dns.xbhl"
      query-type: "A"
    conditions:
      - "[BODY] == 10.100.0.53"
      - "[DNS_RCODE] == NOERROR"

  - name: resolve-intranet-short-hostname-alias
    group: adguard
    url: "router.xbhl.intranet"
    dns:
      query-name: "dns.xbhl"
      query-type: "CNAME"
    conditions:
      - "[BODY] == dns.vm.xbhl.intranet."
      - "[DNS_RCODE] == NOERROR"

  - name: resolve-google-domain-with-adguard
    group: adguard
    url: "dns.xbhl"
    dns:
      query-name: "google.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"

  - name: verify-adguard-container-status
    group: adguard
    url: "http://dns.vm.xbhl.intranet:2375/containers/adguard/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"

  - name: verify-adguard-domain
    group: adguard
    url: "https://adguard.intranet.xbhl.online"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
