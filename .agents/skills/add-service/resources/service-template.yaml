alerts: &alerts
  - type: discord
  - type: email

endpoints:
  - name: <component_name>-<type>-status
    group: <group_name>
    url: "https://<public_domain>/<status_endpoint>"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: <component_name>-container-status
    group: <group_name>
    url: "http://<vm_hostname>:2375/containers/<container_name>/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
