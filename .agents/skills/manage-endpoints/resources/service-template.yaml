# One file per group: src/config/<group_name>.yaml
# Providers: every key under `alerting:` in src/config/global.yaml, in the same order.
alerts: &alerts
  - type: <alert_provider_1>
  - type: <alert_provider_2>

endpoints:
  # Repeat per component: external checks (one per health endpoint), then the container check.
  - name: <component_name>-<type>-status
    group: <group_name>
    url: "https://<public_domain>/<health_endpoint_path>"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "<body_condition>"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    alerts: *alerts

  - name: <component_name>-container-status
    group: <group_name>
    url: "http://<vm_hostname>:2375/containers/<container_name>/json"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Running == true"
      - "[BODY].State.Health.Status == healthy"
